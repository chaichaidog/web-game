# Render Blueprint 設定檔：NOVA Protocol — 失落基地
# 包含：1. PostgreSQL 資料庫  2. FastAPI Web Service 後端  3. Vite Static Site 前端

databases:
  - name: nova-protocol-db
    databaseName: nova_protocol
    user: nova_admin
    plan: free

services:
  # 後端：FastAPI + WebSocket + SQLAlchemy
  - type: web
    name: nova-protocol-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        fromDatabase:
          name: nova-protocol-db
          property: connectionString
      - key: USE_EMBEDDED_PG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: TEACHER_PASSKEY
        value: "NOVA-TEACHER-2026"
      - key: CORS_ORIGINS
        value: "*"

  # 前端：Vite + Phaser 3 + Google Blockly Static Site
  - type: web
    name: nova-protocol-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_BACKEND_HOST
        fromService:
          type: web
          name: nova-protocol-backend
          property: host
      - key: VITE_API_URL
        value: ""
      - key: VITE_WS_URL
        value: ""
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
